#
# pgOS Hyprland config — from iso/airootfs/etc/skel
#

monitor = ,preferred,auto,auto

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = xdg-user-dirs-update

# --- Look -----------------------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(3b82f6ff)
    col.inactive_border = rgba(1e293baa)
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    shadow {
        enabled = true
        range = 12
        color = rgba(0000004d)
    }
}

animations {
    enabled = true

    bezier = pg, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, pg, popin
    animation = windowsOut, 1, 5, pg, popin
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, pg, slidevert
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

windowrule = float, class:^(pavucontrol)$

# --- Binds -----------------------------------------------------------------

# Programs
bind = SUPER, Return, exec, foot
bind = SUPER, D, exec, fuzzel
bind = SUPER, B, exec, firefox

# Window management
bind = SUPER, Q, killactive,
# WARNING: kills the whole session, no questions asked
bind = SUPER+SHIFT, Q, exit,
bind = SUPER, F, fullscreen, 0
bind = SUPER, V, togglefloating,

# Focus + movement (vim keys and arrows)
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER+SHIFT, left, movewindow, l
bind = SUPER+SHIFT, right, movewindow, r
bind = SUPER+SHIFT, h, movewindow, l
bind = SUPER+SHIFT, l, movewindow, r

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER+SHIFT, 1, movetoworkspace, 1
bind = SUPER+SHIFT, 2, movetoworkspace, 2
bind = SUPER+SHIFT, 3, movetoworkspace, 3
bind = SUPER+SHIFT, 4, movetoworkspace, 4
bind = SUPER+SHIFT, 5, movetoworkspace, 5
bind = SUPER+SHIFT, 6, movetoworkspace, 6
bind = SUPER+SHIFT, 7, movetoworkspace, 7
bind = SUPER+SHIFT, 8, movetoworkspace, 8
bind = SUPER+SHIFT, 9, movetoworkspace, 9
bind = SUPER+SHIFT, 0, movetoworkspace, 10

# Mouse: SUPER + drag
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Screenshots
bind = SUPER, Print, exec, grim -g "$(slurp)" - | wl-copy

# Clipboard history
bind = SUPER+CTRL, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Hardware keys
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioPlay, exec, playerctl play-pause
