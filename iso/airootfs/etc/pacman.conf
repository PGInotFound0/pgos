#
# pgOS pacman.conf — inside the live ISO
#

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 10
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ILoveCandy

# Uncomment once the pgOS repo is published (see repo/make-repo.sh on the
# pgOS source repo) and set the server URL.
#[pgos]
#SigLevel = Optional TrustAll
#Server = https://REPLACE-ME/path/to/repo/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
