#
# pgOS build-side pacman.conf
# Used by mkarchiso to install packages into the live ISO.
#

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 10
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ILoveCandy

#
# Your own package repo (optional) — enable once repo/make-repo.sh has
# produced repo/x86_64/pgos.db and you know where it will be published.
#
#[pgos]
#SigLevel = Optional TrustAll
#Server = file:///absolute/path/to/pgos/repo/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
